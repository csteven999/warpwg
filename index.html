<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WARP+ 配置與 Reserved 提取器</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 650px; margin: 30px auto; padding: 0 20px; line-height: 1.6; }
        button { background: #0070f3; color: white; border: none; padding: 10px 20px; font-size: 16px; border-radius: 5px; cursor: pointer; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        textarea { width: 100%; height: 220px; font-family: monospace; font-size: 13px; margin-top: 10px; padding: 10px; box-sizing: border-box; }
        .label { font-weight: bold; margin-top: 15px; display: block; }
        #status { margin-top: 10px; font-weight: bold; color: #0070f3; }
    </style>
</head>
<body>
    <h2>WARP+ 配置與 Reserved 提取器</h2>
    <p>生成 WireGuard 配置檔並自動計算 <code>"reserved": [x, y, z]</code>：</p>
    <button id="genBtn" onclick="generateWarp()">生成 WARP 配置</button>
    <div id="status"></div>

    <span class="label">Sing-Box / Outbound JSON 格式（包含 reserved）：</span>
    <textarea id="jsonResult" readonly placeholder="JSON 格式會顯示在這裡..."></textarea>

    <span class="label">標準 WireGuard (.conf) 格式：</span>
    <textarea id="confResult" readonly placeholder="WireGuard 設定檔會顯示在這裡..."></textarea>

    <script>
        const API_BASE = "https://warp.daj.workers.dev";

        function bufferToBase64(buf) {
            let binary = '';
            const bytes = new Uint8Array(buf);
            for (let i = 0; i < bytes.byteLength; i++) {
                binary += String.fromCharCode(bytes[i]);
            }
            return window.btoa(binary);
        }

        async function exportPrivateKeyBase64(privateKey) {
            const pkcs8Buf = await window.crypto.subtle.exportKey('pkcs8', privateKey);
            const rawBytes = new Uint8Array(pkcs8Buf).slice(-32);
            let binary = '';
            for (let i = 0; i < rawBytes.byteLength; i++) {
                binary += String.fromCharCode(rawBytes[i]);
            }
            return window.btoa(binary);
        }

        async function generateWarp() {
            const btn = document.getElementById('genBtn');
            const status = document.getElementById('status');
            const confResult = document.getElementById('confResult');
            const jsonResult = document.getElementById('jsonResult');

            btn.disabled = true;
            confResult.value = '';
            jsonResult.value = '';
            status.innerText = '正在本地生成 Curve25519 金鑰對...';

            try {
                // 1. 生成 X25519 金鑰對
                const keyPair = await window.crypto.subtle.generateKey(
                    { name: 'X25519' }, true, ['deriveKey', 'deriveBits']
                );
                const pubRaw = await window.crypto.subtle.exportKey('raw', keyPair.publicKey);
                const privateKeyStr = await exportPrivateKeyBase64(keyPair.privateKey);
                const publicKeyStr = bufferToBase64(pubRaw);

                // 2. 獲取 WARP+ Key
                status.innerText = '正在獲取免費 WARP+ 密鑰...';
                let licenseKey = "";
                try {
                    const keyRes = await fetch("https://raw.githubusercontent.com/yeb996/WarpPlusKey/main/README.md");
                    const keyText = await keyRes.text();
                    const match = keyText.match(/[a-zA-Z0-9]{8}-[a-zA-Z0-9]{8}-[a-zA-Z0-9]{8}/);
                    if (match) licenseKey = match[0];
                } catch (e) {
                    console.warn("無法取得 WARP+ Key，使用預設等級", e);
                }

                // 3. 向 Cloudflare 註冊
                status.innerText = '正在向 Cloudflare 註冊帳號...';
                const regPayload = {
                    key: publicKeyStr,
                    install_id: "",
                    fcm_token: "",
                    tos: new Date().toISOString(),
                    model: "PC",
                    type: "Android",
                    locale: "en_US"
                };

                const regRes = await fetch(`${API_BASE}/v0i1909051800/reg`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json; charset=UTF-8" },
                    body: JSON.stringify(regPayload)
                });

                if (!regRes.ok) throw new Error(`註冊失敗 HTTP ${regRes.status}`);

                const regData = await regRes.json();
                const resResult = regData.result;
                const accountId = resResult.id;
                const token = resResult.token;
                const ipv4 = resResult.config.interface.addresses.v4;
                const ipv6 = resResult.config.interface.addresses.v6;
                const peerPubkey = resResult.config.peers[0].public_key;

                // 4. 計算 Reserved 陣列
                // 原理：將 172.16.0.2 格式轉為後三位的整數陣列
                const ipParts = ipv4.split('.');
                const reserved = [
                    parseInt(ipParts[1], 10),
                    parseInt(ipParts[2], 10),
                    parseInt(ipParts[3], 10)
                ];

                // 5. 套用 WARP+ Key
                if (licenseKey) {
                    status.innerText = '正在綁定 WARP+ 流量資格...';
                    try {
                        await fetch(`${API_BASE}/v0i1909051800/reg/${accountId}/account`, {
                            method: "PUT",
                            headers: {
                                "Content-Type": "application/json; charset=UTF-8",
                                "Authorization": `Bearer ${token}`
                            },
                            body: JSON.stringify({ license: licenseKey })
                        });
                    } catch (e) {
                        console.warn("升級 WARP+ 失敗", e);
                    }
                }

                // 6. 輸出 Sing-box / Xray Outbound JSON 格式
                const jsonContent = {
                    "type": "wireguard",
                    "tag": "WARP+",
                    "server": "engage.cloudflareclient.com",
                    "server_port": 2408,
                    "local_address": [
                        `${ipv4}/32`,
                        `${ipv6}/128`
                    ],
                    "private_key": privateKeyStr,
                    "peer_public_key": peerPubkey,
                    "reserved": reserved,
                    "mtu": 1280
                };

                // 7. 輸出標準 WireGuard conf 格式
                const confContent = `[Interface]
PrivateKey = ${privateKeyStr}
Address = ${ipv4}/32, ${ipv6}/128
DNS = 1.1.1.1, 1.0.0.1
MTU = 1280

[Peer]
PublicKey = ${peerPubkey}
AllowedIPs = 0.0.0.0/0, ::/0
Endpoint = engage.cloudflareclient.com:2408`;

                jsonResult.value = JSON.stringify(jsonContent, null, 2);
                confResult.value = confContent;
                status.innerText = '生成成功！Reserved 已成功計算完成。';

            } catch (err) {
                status.innerText = '生成失敗：' + err.message;
                console.error(err);
            } finally {
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
